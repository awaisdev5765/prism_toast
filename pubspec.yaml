name: prism_toast
description: >-
  Beautiful adaptive toast notifications for Flutter — bottom-centered on
  mobile, stacked top-right on desktop and web, with icons, variants, and
  animations. Part of the Prism package family.
version: 0.1.0
repository: https://github.com/awaisdev5765/prism_toast
issue_tracker: https://github.com/awaisdev5765/prism_toast/issues
topics:
  - toast
  - notification
  - snackbar
  - ui
  - widget

environment:
  sdk: ^3.9.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true